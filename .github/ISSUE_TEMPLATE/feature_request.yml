name: Funktionswunsch / Feature request
description: Eine Idee oder ein neues Gerät. / An idea or a new device.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Für neue Geräte bitte Gerätename und USB-VID:PID angeben (Geräte-Manager, Eigenschaften, Details, Hardware-IDs). / For new devices, please give the device name and USB VID:PID (Device Manager, Properties, Details, Hardware IDs).

        Sicherheitslücken bitte [vertraulich melden](https://github.com/kewe87/CaseHUD/security/advisories/new). / Report security issues [privately](https://github.com/kewe87/CaseHUD/security/advisories/new).
  - type: textarea
    id: idea
    attributes:
      label: Was wünschst du dir? / What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Wofür brauchst du es? / What is it for?
      description: Dein Anwendungsfall hilft bei der Einordnung. / Your use case helps to prioritise.
  - type: textarea
    id: alt
    attributes:
      label: Alternativen / Alternatives
