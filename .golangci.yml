# golangci-lint v2 configuration. Kept deliberately small and low-noise: every
# enabled linter is expected to report 0 issues on the whole tree.
version: "2"

run:
  timeout: 10m

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errcheck
    - errorlint
    - nilerr
    - gosec
  settings:
    staticcheck:
      # the same set as the staticcheck command (no quickfix suggestions and no
      # opinionated style checks)
      checks: ["all", "-QF*", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1023"]
    govet:
      # default analyzers only (no shadow, no fieldalignment)
      disable-all: false
    errcheck:
      exclude-functions:
        # a failing Close/Remove in a cleanup path has no useful reaction
        - os.Remove
        - os.RemoveAll
        - golang.org/x/sys/windows.CloseHandle
        # hash.Hash.Write never returns an error
        - (hash.Hash).Write
        # a failed write to the client of an HTTP response cannot be reported
        - (*encoding/json.Encoder).Encode
        - (net/http.ResponseWriter).Write
        - io.WriteString
        - image/png.Encode
        - image/gif.Encode
        # encoding into a bytes.Buffer cannot fail
        - encoding/binary.Write
        # Win32 calls through LazyProc.Call return the result in the first
        # value; the error is only the last errno, which is not an error here
        - (*golang.org/x/sys/windows.LazyProc).Call
        - golang.org/x/sys/windows.CancelIoEx
        - golang.org/x/sys/windows.GetOverlappedResult
        - golang.org/x/sys/windows.ResetEvent
        - golang.org/x/sys/windows.UnmapViewOfFile
        - golang.org/x/sys/windows.GetWindowThreadProcessId
        - golang.org/x/sys/windows.CreateMutex
        # best-effort cleanup of a child process, a timestamp or a socket
        - (*os/exec.Cmd).Wait
        - (*os.Process).Kill
        - os.Chtimes
        - (*net.UDPConn).WriteToUDP
        - (*bufio.Writer).WriteString
    gosec:
      excludes:
        # G115 integer conversions: sizes and device values are range-checked
        #      or fixed-width by the wire formats; flagged everywhere in
        #      protocol code.
        - G115
        # G103 use of unsafe: needed for the Win32 / WinUSB / HID calls.
        - G103
        # G304 file inclusion via variable: paths come from the user's own
        #      settings, the config directory or file dialogs of a local app.
        - G304
        # G301/G306 directory and file permissions: a per-user app data
        #      directory on Windows, where unix modes have no meaning.
        - G301
        - G306
        # G204 subprocess with variable: fixed system tools with arguments
        #      built by the app (sc, powershell, installer), no shell.
        - G204
        # G703/G705/G706 taint analysis (path traversal, XSS, log injection):
        #      false positives for a local app whose "tainted" inputs are its
        #      own command line, config and validated media names; JSON and
        #      PNG responses are not HTML.
        - G703
        - G705
        - G706
        # G118 goroutine with context.Background: long-lived engine workers
        #      that are not tied to a request.
        - G118
        # G104 unhandled errors: covered by errcheck with a tuned exclude list.
        - G104
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      # tests: unchecked errors and weak primitives are fine in test code
      - path: _test\.go
        linters:
          - errcheck
          - gosec
      # Close methods are never worth checking in cleanup paths
      - linters:
          - errcheck
        text: "Error return value of .*Close.* is not checked"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
